name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --no-frozen-lockfile

      # The repository ships the compiled host half and the client bundle, so a
      # release packs exactly what Git installs consume. `check:dist` recompiles
      # into a scratch directory and proves the committed output still matches
      # the TypeScript sources; it never touches `lib/`.
      - name: Verify committed build
        run: pnpm run check:dist

      - name: Smoke test client bundle
        run: node tests/smoke-client.mjs

      - name: Package
        run: pnpm pack

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: 'dsh-anysearch-ev-*.tgz'
          generate_release_notes: true
