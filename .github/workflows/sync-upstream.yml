name: Sync upstream

on:
  schedule:
    # Daily at 03:17 UTC. Upstream is a stable service; most runs are no-ops.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream main
        id: merge
        run: |
          git remote add upstream https://github.com/anysearch-team/anysearch-dsh.git || true
          git fetch upstream main
          if git merge upstream/main --no-edit; then
            echo "conflict=0" >> "$GITHUB_OUTPUT"
          else
            git merge --abort || true
            echo "conflict=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh lockfile
        if: steps.merge.outputs.conflict == '0'
        run: |
          corepack enable
          pnpm install --lockfile-only
          git add pnpm-lock.yaml package.json || true
          git commit -m "chore: refresh lockfile after upstream sync" || true

      - name: Push clean merge
        if: steps.merge.outputs.conflict == '0'
        run: git push origin HEAD:main

      - name: Report merge conflict
        if: steps.merge.outputs.conflict == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              'The scheduled upstream sync hit merge conflicts, so nothing was pushed.',
              '',
              'Resolve locally:',
              '```bash',
              'git fetch https://github.com/anysearch-team/anysearch-dsh.git main',
              'git merge FETCH_HEAD',
              '# keep the fork fields in package.json (name, version, dsh.client, esbuild devDependency)',
              'pnpm install --lockfile-only',
              'git push',
              '```',
              '',
              'Conflicts are normally limited to `package.json` and `pnpm-lock.yaml`.',
            ].join('\n')
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Upstream sync conflict (${new Date().toISOString().slice(0, 10)})`,
              body,
            })
