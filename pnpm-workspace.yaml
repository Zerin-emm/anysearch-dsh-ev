  # bundle build (scripts/build-client.mjs) needs it.
  esbuild: true
minimumReleaseAgeExclude:
  # Retained reviewed foundation versions still present in pnpm-lock.yaml.
  - '@deepseek-ai/cosmokit@1.8.2'
  - '@deepseek-ai/schemastery@3.18.1'
